<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooking mode: timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
@keyframes dcPulse{0%{transform:scale(1)}50%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes dcHalo{0%{opacity:0;transform:scale(0.96)}50%{opacity:0.14}100%{opacity:0;transform:scale(1.06)}}
@keyframes dcHaloDone{0%{opacity:0.2;transform:scale(0.98)}50%{opacity:0.6}100%{opacity:0;transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){.dc-motion{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #FFFFFF; font-family: Inter, sans-serif; color: #111111; overflow: hidden">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 14px">
      <a href="Recipe.dc.html" aria-label="Exit cooking mode" style="width: 44px; height: 44px; border-radius: 999px; background: #F2F2F0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700">Step 4 of 6 · Shakshuka</span>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
          <span style="height: 4px; border-radius: 2px; background: #111111"></span>
          <span style="height: 4px; border-radius: 2px; background: #111111"></span>
          <span style="height: 4px; border-radius: 2px; background: #111111"></span>
          <span style="height: 4px; border-radius: 2px; background: #111111"></span>
          <span style="height: 4px; border-radius: 2px; background: #E4E4E0"></span>
          <span style="height: 4px; border-radius: 2px; background: #E4E4E0"></span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 23px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em">Make four wells in the sauce, crack in the eggs, cover and simmer until the whites set.</p>
      <div style="display: flex; gap: 8px">
        <span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: #F2F2F0; font-size: 13px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 99px; background: #F7D23A; border: 1px solid #C9A800; box-sizing: border-box"></span>4 large eggs</span>
        <span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: #F2F2F0; font-size: 13px; font-weight: 600">Lid on · low heat</span>
      </div>
    </div>

    <div style="display: flex; justify-content: center">
      <div style="position: relative; width: 264px; height: 264px">
        <div class="dc-motion" style="{{ main.haloStyle }}" aria-hidden="true"></div>
        <div class="dc-motion" style="{{ main.ringWrapStyle }}">
          <svg width="264" height="264" viewBox="0 0 264 264" role="img" aria-label="{{ main.aria }}">
            <circle cx="132" cy="132" r="120" fill="{{ main.face }}" stroke="#ECECE8" stroke-width="14"></circle>
            <circle cx="132" cy="132" r="120" fill="none" stroke="{{ main.color }}" stroke-width="{{ main.stroke }}" stroke-linecap="round" stroke-dasharray="753.98" stroke-dashoffset="{{ main.offset }}" transform="rotate(-90 132 132)"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
            <span style="{{ main.clockStyle }}">{{ main.clock }}</span>
            <span style="{{ main.statusStyle }}">{{ main.status }}</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: center; align-items: center; gap: 22px">
      <button onClick="{{ reset }}" aria-label="Reset timer" style="width: 52px; height: 52px; border-radius: 999px; border: 1.5px solid #D6D6D1; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4"></path></svg>
      </button>
      <button onClick="{{ toggle }}" aria-label="{{ toggleLabel }}" style="width: 72px; height: 72px; border-radius: 999px; border: none; background: #111111; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{ running }}" hint-placeholder-val="{{ true }}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </sc-if>
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
        </sc-if>
      </button>
      <button onClick="{{ addTime }}" aria-label="Add 30 seconds" style="width: 52px; height: 52px; border-radius: 999px; border: 1.5px solid #D6D6D1; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #111111">+30</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #595954">Also running</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ minis }}" as="m" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 1px solid #E4E4E0">
            <div class="dc-motion" style="{{ m.ringWrapStyle }}">
              <svg width="52" height="52" viewBox="0 0 52 52" role="img" aria-label="{{ m.aria }}">
                <circle cx="26" cy="26" r="22" fill="{{ m.face }}" stroke="#ECECE8" stroke-width="5"></circle>
                <circle cx="26" cy="26" r="22" fill="none" stroke="{{ m.color }}" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.23" stroke-dashoffset="{{ m.offset }}" transform="rotate(-90 26 26)"></circle>
              </svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 13px; font-weight: 600; white-space: nowrap">{{ m.label }}</span>
              <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{ m.clock }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; gap: 10px">
    <a href="#" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid #D6D6D1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Previous</a>
    <a href="#" style="flex: 2; height: 52px; border-radius: 14px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Next step</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demoSpeed":{"editor":"enum","options":["1x","10x","30x"],"default":"30x","section":"Timer"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      running: true,
      timers: [
        { label: 'Eggs set', total: 360, left: 360 },
        { label: 'Toast pita', total: 150, left: 70 },
        { label: 'Warm plates', total: 240, left: 30 }
      ]
    };
  }
  componentDidMount() {
    var self = this;
    this._t = setInterval(function () { self.tick(); }, 100);
  }
  componentWillUnmount() {
    clearInterval(this._t);
  }
  speed() {
    var s = this.props.demoSpeed || '30x';
    return s === '1x' ? 1 : (s === '10x' ? 10 : 30);
  }
  tick() {
    if (!this.state.running) return;
    var step = 0.1 * this.speed();
    var timers = this.state.timers.map(function (t) {
      return { label: t.label, total: t.total, left: Math.max(0, t.left - step) };
    });
    this.setState({ timers: timers });
  }
  mix(a, b, k) {
    function p(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
    var x = p(a), y = p(b);
    var c = x.map(function (v, i) { return Math.round(v + (y[i] - v) * k); });
    return '#' + c.map(function (v) { var s = v.toString(16); return s.length < 2 ? '0' + s : s; }).join('');
  }
  colorFor(f) {
    // neutral (graphite) -> green -> yellow -> red as time runs out
    var stops = [
      { at: 1.0, c: '#3A3A38' },
      { at: 0.5, c: '#8A8A85' },
      { at: 0.32, c: '#2E9E4F' },
      { at: 0.14, c: '#F2C200' },
      { at: 0.0, c: '#E5392B' }
    ];
    for (var i = 0; i < stops.length - 1; i++) {
      var hi = stops[i], lo = stops[i + 1];
      if (f <= hi.at && f >= lo.at) {
        return this.mix(hi.c, lo.c, (hi.at - f) / (hi.at - lo.at));
      }
    }
    return f > 1 ? stops[0].c : stops[stops.length - 1].c;
  }
  pulseSecs(f) {
    if (f <= 0) return 1.6;
    if (f > 0.5) return 4.0;
    return 1.8 + (f / 0.5) * 2.2;
  }
  clock(sec) {
    var s = Math.ceil(sec);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  view(t, circ, size) {
    var f = t.total > 0 ? t.left / t.total : 0;
    var done = f <= 0;
    var color = done ? '#FF2A12' : this.colorFor(f);
    var dur = this.pulseSecs(f);
    var moving = this.state.running || f <= 0;
    var anim = moving ? 'animation: dcPulse ' + dur.toFixed(2) + 's ease-in-out infinite;' : '';
    return {
      label: t.label,
      color: color,
      offset: (circ * (1 - f)).toFixed(2),
      clock: f <= 0 ? 'Done' : this.clock(t.left),
      aria: t.label + ', ' + (f <= 0 ? 'done' : this.clock(t.left) + ' left'),
      status: f <= 0 ? 'Ready. Lift the lid.' : (this.state.running ? t.label : 'Paused'),
      ringWrapStyle: 'position: relative; width: ' + size + 'px; height: ' + size + 'px; flex-shrink: 0; ' + anim,
      face: done ? '#FF2A12' : '#FFFFFF',
      stroke: done ? 18 : 14,
      clockStyle: "font-family: 'Space Grotesk', sans-serif; font-size: 58px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: " + (done ? '#FFFFFF' : '#111111'),
      statusStyle: 'font-size: 14px; font-weight: ' + (done ? '700' : '600') + '; color: ' + (done ? '#FFFFFF' : '#595954'),
      haloStyle: 'position: absolute; inset: ' + (done ? '-14px' : '-6px') + '; border-radius: 999px; background: ' + color + '; ' + (done ? 'animation: dcHaloDone ' + dur.toFixed(2) + 's ease-out infinite;' : (moving ? 'animation: dcHalo ' + dur.toFixed(2) + 's ease-out infinite;' : 'opacity: 0;'))
    };
  }
  renderVals() {
    var self = this;
    var ts = this.state.timers;
    return {
      main: this.view(ts[0], 753.98, 264),
      minis: ts.slice(1).map(function (t) { return self.view(t, 138.23, 52); }),
      running: this.state.running,
      paused: !this.state.running,
      toggleLabel: this.state.running ? 'Pause timer' : 'Start timer',
      toggle: function () { self.setState({ running: !self.state.running }); },
      reset: function () {
        self.setState({ timers: self.state.timers.map(function (t, i) { return { label: t.label, total: t.total, left: i === 0 ? t.total : t.left }; }), running: true });
      },
      addTime: function () {
        self.setState({ timers: self.state.timers.map(function (t, i) { return i === 0 ? { label: t.label, total: Math.max(t.total, t.left + 30), left: t.left + 30 } : t; }) });
      }
    };
  }
}
</script>
</body>
</html>
