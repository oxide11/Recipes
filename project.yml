name: Recipes

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42.0"

configFiles:
  Debug: Configs/Shared.xcconfig
  Release: Configs/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_TESTABILITY: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Recipes:
    type: application
    platform: iOS
    sources:
      - path: Recipes
        excludes:
          - "Info.plist"
          - "Preview"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX)"
        INFOPLIST_FILE: Recipes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: RecipesWidgets

  RecipesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecipesTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recipes.RecipesTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: NO
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Recipes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recipes"
    dependencies:
      - target: Recipes

  RecipesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RecipesWidgets
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).RecipesWidgets"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: RecipesWidgets
        INFOPLIST_KEY_LSApplicationCategoryType: ""
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

schemes:
  Recipes:
    build:
      targets:
        Recipes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecipesTests
      testPlans:
        - path: Recipes.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
